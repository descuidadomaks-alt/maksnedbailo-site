<!DOCTYPE html>
<!--
  imessage-followup.html — modern iOS Messages mock (iPhone 13 mini, 375×812 logical @3x)
  Auto-plays a ~9s HVAC follow-up conversation for screen recording.
  UI matches the newer iOS Messages look: floating back pill with unread badge,
  large silhouette avatar with name pill, "Text Message • SMS" intro stamp,
  top-anchored thread, floating input bar.

  RECORDING:
  - Record just the 375×812 screen div (it fills the frame, no bezel).
  - Easiest crisp capture: Chrome DevTools -> device toolbar -> add a custom
    device 375×812 @ DPR 3, then record the viewport. Or zoom the browser
    (Cmd/Ctrl +) and crop in post. Scrollbars are hidden.
  - The Replay button sits BELOW the screen, outside the capture area.

  CONFIG: MESSAGES / TOTAL_MS / CONTACT_NAME / USE_IMESSAGE_BLUE / STATUS_TIME /
  DAY_STAMP / UNREAD_COUNT live at the top of the <script> block.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iMessage follow-up — Peak Comfort HVAC</title>
<style>
  :root {
    --sent: #34C759;          /* overridden to #0A84FF by USE_IMESSAGE_BLUE */
    --received: #E9E9EB;
    --grey-label: #8E8E93;
    --screen-bg: #FFFFFF;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: #000;
    font-family: -apple-system, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 20px 0;
  }

  /* ============ PHONE SCREEN (capture area, 375×812) ============ */
  .screen {
    width: 375px;
    height: 812px;
    background: var(--screen-bg);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
    flex: none;
  }

  /* ---- Status bar ---- */
  .status-bar {
    height: 47px;
    flex: none;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px 0 30px;
  }
  .status-time {
    font-size: 16px;
    font-weight: 700;
    letter-spacing: -0.3px;
    color: #000;
    font-variant-numeric: tabular-nums;
  }
  .status-icons { display: flex; align-items: center; gap: 7px; }
  .status-icons svg { display: block; }
  .battery {
    position: relative;
    width: 30px;
    height: 15px;
    display: flex;
    align-items: center;
  }
  .battery .body {
    width: 27px;
    height: 15px;
    border-radius: 4.5px;
    background: #000;
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    display: flex;
    align-items: center;
    justify-content: center;
    letter-spacing: -0.2px;
    font-variant-numeric: tabular-nums;
  }
  .battery .nub {
    width: 2px;
    height: 5px;
    margin-left: 1px;
    border-radius: 0 2px 2px 0;
    background: rgba(0,0,0,0.4);
  }

  /* ---- Floating header ---- */
  .header {
    flex: none;
    position: relative;
    height: 132px;
    padding-top: 2px;
  }
  .back-pill {
    position: absolute;
    left: 14px;
    top: 10px;
    height: 42px;
    display: flex;
    align-items: center;
    gap: 8px;
    background: #fff;
    border-radius: 21px;
    padding: 0 12px 0 14px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.10), 0 0 0 0.5px rgba(0,0,0,0.04);
  }
  .unread-badge {
    background: #1C1C1E;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    border-radius: 11px;
    padding: 3px 9px;
    letter-spacing: 0.1px;
    font-variant-numeric: tabular-nums;
  }
  .header-center {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    top: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }
  .avatar {
    width: 62px;
    height: 62px;
    border-radius: 50%;
    background: linear-gradient(180deg, #B3BCE5 0%, #8493C9 100%);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    overflow: hidden;
  }
  .name-pill {
    display: flex;
    align-items: center;
    gap: 5px;
    background: #fff;
    border-radius: 17px;
    padding: 7px 13px 7px 15px;
    margin-top: -6px;
    position: relative;
    box-shadow: 0 1px 5px rgba(0,0,0,0.12), 0 0 0 0.5px rgba(0,0,0,0.04);
    max-width: 240px;
  }
  .name-pill span {
    font-size: 16.5px;
    font-weight: 700;
    color: #000;
    letter-spacing: -0.2px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ---- Thread (top-anchored, like a fresh conversation) ---- */
  .thread {
    flex: 1 1 auto;
    overflow-y: auto;
    scrollbar-width: none;
  }
  .thread::-webkit-scrollbar { display: none; }
  .thread-inner {
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    padding: 4px 16px 12px;
  }
  .intro-stamp {
    text-align: center;
    font-size: 13px;
    line-height: 1.45;
    color: var(--grey-label);
    padding: 2px 0 14px;
    letter-spacing: 0.05px;
  }

  /* ---- Bubbles ---- */
  .msg-row { display: flex; margin-top: 8px; }
  .msg-row.stacked { margin-top: 2px; }
  .msg-row.business { justify-content: flex-start; }
  .msg-row.customer { justify-content: flex-end; }

  .bubble {
    position: relative;
    max-width: 72%;
    padding: 8px 13px;
    border-radius: 18px;
    font-size: 16.5px;
    line-height: 1.26;
    letter-spacing: -0.2px;
    word-wrap: break-word;
    z-index: 0;
  }
  .bubble.business { background: var(--received); color: #000; }
  .bubble.customer { background: var(--sent); color: #fff; }

  /* iOS tails — blob + background-colored mask, pure CSS so crisp at 3× */
  .bubble.tail::before {
    content: "";
    position: absolute;
    bottom: 0;
    width: 12px;
    height: 19px;
    z-index: -1;
  }
  .bubble.tail::after {
    content: "";
    position: absolute;
    bottom: 0;
    width: 12px;
    height: 19px;
    background: var(--screen-bg);
  }
  .bubble.business.tail::before {
    left: -5.5px;
    background: var(--received);
    border-bottom-right-radius: 14px 12px;
  }
  .bubble.business.tail::after {
    left: -12px;
    border-bottom-right-radius: 8px;
  }
  .bubble.customer.tail::before {
    right: -5.5px;
    background: var(--sent);
    border-bottom-left-radius: 14px 12px;
  }
  .bubble.customer.tail::after {
    right: -12px;
    border-bottom-left-radius: 8px;
  }

  /* ---- Entrance animations ---- */
  @keyframes popInReceived {
    from { transform: scale(0.92) translateY(8px); opacity: 0; }
    to   { transform: scale(1) translateY(0);      opacity: 1; }
  }
  @keyframes riseInSent {
    from { transform: translateY(10px); opacity: 0; }
    to   { transform: translateY(0);    opacity: 1; }
  }
  .bubble.business.anim {
    transform-origin: bottom left;
    animation: popInReceived 250ms cubic-bezier(0.22, 1, 0.36, 1) both;
  }
  .bubble.customer.anim {
    transform-origin: bottom right;
    animation: riseInSent 200ms cubic-bezier(0.22, 1, 0.36, 1) both;
  }

  /* ---- Typing indicator ---- */
  .bubble.typing {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 12px 16px;
    min-height: 36px;
  }
  .typing .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #9E9EA3;
    animation: typingBounce 1.2s ease-in-out infinite;
  }
  .typing .dot:nth-child(2) { animation-delay: 0.15s; }
  .typing .dot:nth-child(3) { animation-delay: 0.3s; }
  @keyframes typingBounce {
    0%, 60%, 100% { opacity: 0.35; transform: scale(0.85); }
    30%           { opacity: 1;    transform: scale(1); }
  }

  /* ---- Floating input bar ---- */
  .input-area {
    flex: none;
    padding: 8px 14px 6px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .plus-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,0.10), 0 0 0 0.5px rgba(0,0,0,0.05);
    display: flex;
    align-items: center;
    justify-content: center;
    flex: none;
  }
  .text-field {
    flex: 1 1 auto;
    height: 42px;
    border-radius: 21px;
    background: #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08), 0 0 0 0.5px rgba(0,0,0,0.06);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 12px 0 16px;
  }
  .text-field .placeholder {
    font-size: 16.5px;
    color: #B9B9BE;
    letter-spacing: -0.2px;
  }

  /* ---- Home indicator ---- */
  .home-area {
    flex: none;
    height: 26px;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding-top: 7px;
  }
  .home-indicator {
    width: 134px;
    height: 5px;
    border-radius: 2.5px;
    background: #000;
  }

  /* ============ Replay (outside capture) ============ */
  .replay-btn {
    flex: none;
    background: #1C1C1E;
    color: #fff;
    border: 1px solid #3A3A3C;
    border-radius: 18px;
    padding: 8px 24px;
    font-size: 15px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
  }
  .replay-btn:hover { background: #2C2C2E; }
</style>
</head>
<body>

  <div class="screen" id="screen">

    <div class="status-bar">
      <div class="status-time" id="statusTime">2:14</div>
      <div class="status-icons">
        <!-- cellular bars (partial, like real captures) -->
        <svg width="19" height="13" viewBox="0 0 19 13" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="0"    y="8"   width="3.4" height="5"  rx="1.2" fill="#000"/>
          <rect x="5.1"  y="5.3" width="3.4" height="7.7" rx="1.2" fill="#000"/>
          <rect x="10.2" y="2.7" width="3.4" height="10.3" rx="1.2" fill="#C7C7CC"/>
          <rect x="15.3" y="0"   width="3.4" height="13" rx="1.2" fill="#C7C7CC"/>
        </svg>
        <!-- wifi -->
        <svg width="18" height="13" viewBox="0 0 17 12" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M8.5 2.44c2.42 0 4.75.93 6.51 2.61a.5.5 0 0 0 .71-.02l1.13-1.14a.53.53 0 0 0-.01-.75A12.24 12.24 0 0 0 8.5 0C5.36 0 2.36 1.12.16 3.14a.53.53 0 0 0-.01.75l1.13 1.14c.2.2.51.2.71.02A9.44 9.44 0 0 1 8.5 2.44Z" fill="#000"/>
          <path d="M8.5 6.28c1.33 0 2.61.5 3.59 1.4.2.18.5.18.69-.01l1.13-1.14a.53.53 0 0 0-.02-.76 8.1 8.1 0 0 0-10.78 0 .53.53 0 0 0-.02.76l1.13 1.14c.19.19.5.2.69.01a5.32 5.32 0 0 1 3.59-1.4Z" fill="#000"/>
          <path d="M10.75 10.03c0 .14-.06.28-.16.38l-1.72 1.73a.52.52 0 0 1-.74 0L6.4 10.41a.53.53 0 0 1 .04-.79 3.25 3.25 0 0 1 4.1 0c.13.1.2.25.2.41Z" fill="#000"/>
        </svg>
        <!-- battery with % inside -->
        <div class="battery">
          <div class="body" id="batteryPct">59</div>
          <div class="nub"></div>
        </div>
      </div>
    </div>

    <div class="header">
      <div class="back-pill">
        <svg width="11" height="19" viewBox="0 0 11 19" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M9.5 1.5 2 9.5l7.5 8" stroke="#000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div class="unread-badge" id="unreadBadge">362</div>
      </div>
      <div class="header-center">
        <div class="avatar">
          <!-- generic contact silhouette -->
          <svg width="62" height="62" viewBox="0 0 62 62" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="31" cy="24.5" r="10.5" fill="#fff"/>
            <path d="M31 38c-11.3 0-18.6 6.4-20.6 12.6A31 31 0 0 0 31 62a31 31 0 0 0 20.6-11.4C49.6 44.4 42.3 38 31 38Z" fill="#fff"/>
          </svg>
        </div>
        <div class="name-pill">
          <span id="contactName">Peak Comfort HVAC</span>
          <svg width="7" height="12" viewBox="0 0 7 12" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M1 1l4.5 5L1 11" stroke="#B0B0B5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>
    </div>

    <div class="thread" id="thread">
      <div class="thread-inner" id="threadInner"></div>
    </div>

    <div class="input-area">
      <div class="plus-btn">
        <svg width="17" height="17" viewBox="0 0 17 17" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M8.5 1.5v14M1.5 8.5h14" stroke="#1C1C1E" stroke-width="1.9" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="text-field">
        <span class="placeholder">Text Message &bull; SMS</span>
        <svg width="14" height="21" viewBox="0 0 13 20" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="3.75" y="0.75" width="5.5" height="11" rx="2.75" stroke="#8E8E93" stroke-width="1.5"/>
          <path d="M1 9.5a5.5 5.5 0 0 0 11 0" stroke="#8E8E93" stroke-width="1.5" stroke-linecap="round"/>
          <path d="M6.5 15.5V19" stroke="#8E8E93" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
    </div>

    <div class="home-area">
      <div class="home-indicator"></div>
    </div>

  </div>

  <button class="replay-btn" id="replayBtn">↻ Replay</button>

<script>
  /* ============================ CONFIG ============================ */
  const CONTACT_NAME = "Peak Comfort HVAC";
  const STATUS_TIME  = "2:14";
  const DAY_STAMP    = "Today 9:49 AM";     // shown under "Text Message • SMS"
  const UNREAD_COUNT = "362";               // badge in the back pill
  const USE_IMESSAGE_BLUE = false;          // true -> blue #0A84FF sent bubbles
  const TOTAL_MS = 9000;                    // full sequence settles within this

  // from: 'business' (received, grey, left) | 'customer' (sent, green, right)
  // at:   ms when the typing indicator starts (business) or bubble appears
  // typingMs: how long the typing indicator shows before the bubble swaps in
  const MESSAGES = [
    { from: "business", text: "You're booked for AC repair today, 2–4 PM — 212 Birch Ln. Reply C to confirm.", at: 0,    typingMs: 800 },
    { from: "customer", text: "Yes! Thanks 🙏",                                                              at: 1900 },
    { from: "business", text: "⏰ Reminder: your tech's arriving 2–4 PM today. See you soon!",                 at: 3200, typingMs: 700 },
    { from: "business", text: "Mike's on his way — ETA ~20 min 🚚",                                      at: 5200 },
    { from: "customer", text: "Perfect, see you then 👍",                                                    at: 6400 },
  ];
  /* ================================================================ */

  if (USE_IMESSAGE_BLUE) {
    document.documentElement.style.setProperty("--sent", "#0A84FF");
  }
  document.getElementById("statusTime").textContent = STATUS_TIME;
  document.getElementById("contactName").textContent = CONTACT_NAME;
  document.getElementById("unreadBadge").textContent = UNREAD_COUNT;

  const INTRO_HTML =
    '<div class="intro-stamp">Text Message &bull; SMS<br>' + DAY_STAMP + "</div>";

  const thread      = document.getElementById("thread");
  const threadInner = document.getElementById("threadInner");
  const replayBtn   = document.getElementById("replayBtn");

  let timers = [];
  let lastRow = null;      // previous message row, for tail + grouping logic

  function schedule(fn, ms) { timers.push(setTimeout(fn, ms)); }

  function scrollToBottom() {
    thread.scrollTo({ top: thread.scrollHeight, behavior: "smooth" });
  }

  function makeRow(from) {
    const row = document.createElement("div");
    row.className = "msg-row " + from;
    // stacked same-sender bubbles sit 2px apart; previous one loses its tail
    if (lastRow && lastRow.dataset.from === from) {
      row.classList.add("stacked");
      const prevBubble = lastRow.querySelector(".bubble");
      if (prevBubble) prevBubble.classList.remove("tail");
    }
    row.dataset.from = from;
    return row;
  }

  function addTypingIndicator(from) {
    const row = makeRow(from);
    const bubble = document.createElement("div");
    bubble.className = "bubble " + from + " typing tail anim";
    bubble.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
    row.appendChild(bubble);
    threadInner.appendChild(row);
    lastRow = row;
    requestAnimationFrame(scrollToBottom);
    return row;
  }

  function addMessage(from, text, typingRow) {
    let row;
    if (typingRow) {
      // swap the typing indicator into the real message, re-popping the spring
      row = typingRow;
      row.innerHTML = "";
    } else {
      row = makeRow(from);
      threadInner.appendChild(row);
      lastRow = row;
    }
    const bubble = document.createElement("div");
    bubble.className = "bubble " + from + " tail anim";
    bubble.textContent = text;
    row.appendChild(bubble);
    requestAnimationFrame(scrollToBottom);
  }

  function play() {
    timers.forEach(clearTimeout);
    timers = [];
    lastRow = null;
    threadInner.innerHTML = INTRO_HTML;
    thread.scrollTop = 0;

    MESSAGES.forEach(msg => {
      if (msg.from === "business" && msg.typingMs) {
        let typingRow = null;
        schedule(() => { typingRow = addTypingIndicator("business"); }, msg.at);
        schedule(() => addMessage("business", msg.text, typingRow), msg.at + msg.typingMs);
      } else {
        schedule(() => addMessage(msg.from, msg.text, null), msg.at);
      }
    });
  }

  replayBtn.addEventListener("click", play);
  play();
</script>
</body>
</html>
